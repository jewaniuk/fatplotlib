[project]
name = "fatplotlib"
version = "0.1.0"
description = "modern tooling for preparing academic figures, not just plots"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "jewaniuk", email = "jacob.ewaniuk@queensu.ca" }
]
requires-python = ">=3.14"
dependencies = [
    "typst>=0.15.2",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
