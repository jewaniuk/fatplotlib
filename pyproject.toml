[project]
name = "fatplotlib"
version = "0.1.0"
description = "modern tooling for preparing academic figures, not just plots"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "jewaniuk", email = "jacob.ewaniuk@queensu.ca" }
]
requires-python = ">=3.14"
dependencies = [
    "cmap>=0.8.0",
    "kiwisolver>=1.5.1",
    "numpy>=2.5.5",
    "resvg-py>=0.5.0",
    "typst>=0.15.2",
    "watchfiles>=1.3.0",
]

[project.scripts]
fpl = "fatplotlib.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# imports sorted, and functions kept small enough to read (`C901` is flake8's mccabe complexity, at its default of 10,
# and `PLR0917` counts positional arguments only, so a function taking its options by keyword is never flagged)
extend-select = ["I", "C901", "PLR0911", "PLR0912", "PLR0915", "PLR0917"]

[tool.ruff.lint.flake8-bugbear]
# frozen dataclasses, safe to share as defaults
extend-immutable-calls = ["fatplotlib.style.Token", "fatplotlib.style.Stroke", "fatplotlib.axes.AxesStyle", "fatplotlib.axes.Marker"]
