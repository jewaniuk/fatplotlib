[project]
name = "fatplotlib"
version = "0.1.0"
description = "modern tooling for preparing academic figures, not just plots"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "jewaniuk", email = "jacob.ewaniuk@queensu.ca" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.5",
    "resvg-py>=0.5.0",
    "typst>=0.15.2",
    "watchfiles>=1.3.0",
]

[project.scripts]
fpl = "fatplotlib.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
